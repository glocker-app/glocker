openapi: 3.0.3
info:
  title: glockpeek-web API
  version: 0.1.0
  description: >
    Serves the parsed glocker log history (violations, unblocks, lifecycle
    events, and computed unmanaged periods) to the dashboard frontend. All
    aggregation and date-range filtering happens client-side; these endpoints
    return the full parsed data set.
servers:
  - url: http://localhost:4317
paths:
  /api/data:
    get:
      summary: Full parsed glocker history
      operationId: getData
      responses:
        "200":
          description: Parsed history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Data"
        "500":
          description: Server error reading or parsing logs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/rules:
    get:
      summary: The saved usage categorization config (rules + tag colours)
      operationId: getRules
      responses:
        "200":
          description: Current config
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsageConfig"
        "500":
          description: Server error reading the config file
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    put:
      summary: Replace the whole usage categorization config
      operationId: putRules
      description: >
        Body is a `{ rules, colors }` object (a bare array of rules is still
        accepted for back-compat). Everything is sanitized before being written;
        the raw usage log is never modified.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: array
                  items:
                    $ref: "#/components/schemas/UsageRule"
                - $ref: "#/components/schemas/UsageConfig"
      responses:
        "200":
          description: The sanitized config that was saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsageConfig"
        "500":
          description: Server error writing the config file
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/ignored:
    get:
      summary: Violations marked as false positives (hidden from all stats)
      operationId: getIgnored
      responses:
        "200":
          description: Current ignore list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IgnoredConfig"
        "500":
          description: Server error reading the ignore file
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    put:
      summary: Replace the whole false-positive ignore list
      operationId: putIgnored
      description: >
        Body is `{ ignored: [...] }`. Each entry (ts + keyword + url) identifies a
        single recorded violation to hide from counts. Non-destructive — the raw
        reports log is never modified.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IgnoredConfig"
      responses:
        "200":
          description: The deduped ignore list that was saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IgnoredConfig"
        "500":
          description: Server error writing the ignore file
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/health:
    get:
      summary: Liveness and which log files were found
      operationId: getHealth
      responses:
        "200":
          description: Health status
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  sources:
                    $ref: "#/components/schemas/Sources"
                  paths:
                    type: object
                    additionalProperties:
                      type: string
  /api/billing/checkout:
    post:
      summary: Start a checkout for the paid tier (Merchant-of-Record, Polar)
      description: >
        Creates a Polar checkout session for the authenticated account and
        returns the hosted checkout URL to redirect the browser to. The account's
        numeric id is attached as external_customer_id (never the email), so the
        webhook can map the resulting subscription back without glockpeek holding
        payer PII. Only mounted when billing is enabled; session-gated.
      operationId: startBillingCheckout
      responses:
        "200":
          description: Checkout session created
          content:
            application/json:
              schema:
                type: object
                properties:
                  url:
                    type: string
                    format: uri
                    description: Hosted Polar checkout URL to redirect the customer to.
        "401":
          description: Not authenticated
        "502":
          description: Upstream (Polar) error creating the checkout
  /api/billing/webhook:
    post:
      summary: Merchant-of-Record subscription webhook (Polar)
      description: >
        Receives Polar subscription lifecycle events. The request is verified
        against the Standard Webhooks HMAC signature before anything is trusted;
        the event is then mapped onto the account's device limit —
        active/uncanceled grant the paid cap, revoked drops back to free, canceled
        keeps access until the period end. Not session-gated (the caller is Polar,
        authenticated by the signature, not a browser). Idempotent.
      operationId: billingWebhook
      parameters:
        - in: header
          name: webhook-id
          required: true
          schema: { type: string }
        - in: header
          name: webhook-timestamp
          required: true
          schema: { type: string }
        - in: header
          name: webhook-signature
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: A Polar webhook event; only subscription.* types are acted on.
              properties:
                type:
                  type: string
                  example: subscription.active
                data:
                  type: object
      responses:
        "200":
          description: Event applied, or safely ignored/acked (unknown account or unhandled type)
        "401":
          description: Signature verification failed
        "502":
          description: Transient processing error; Polar should retry
        "503":
          description: Billing webhook not configured (no valid signing secret)

components:
  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
    IgnoredConfig:
      type: object
      properties:
        ignored:
          type: array
          items:
            $ref: "#/components/schemas/IgnoredViolation"
    IgnoredViolation:
      type: object
      description: >
        One recorded violation marked as a false positive. Matched by ts +
        keyword + url; domain is stored only for display.
      properties:
        ts:
          type: integer
          format: int64
          description: Event time in epoch milliseconds (matches Violation.ts).
        keyword:
          type: string
        url:
          type: string
        domain:
          type: string
    Sources:
      type: object
      description: Whether each log file was found and readable.
      properties:
        reports:
          type: boolean
        unblocks:
          type: boolean
        lifecycle:
          type: boolean
        usage:
          type: boolean
        heartbeat:
          type: boolean
    Violation:
      type: object
      description: One content/URL keyword violation report.
      properties:
        ts:
          type: integer
          format: int64
          description: Event time in epoch milliseconds (local-zone naive timestamp).
        type:
          type: string
          enum: [url-keyword, content-keyword]
        keyword:
          type: string
        url:
          type: string
        domain:
          type: string
    Unblock:
      type: object
      description: One temporary unblock grant.
      properties:
        ts:
          type: integer
          format: int64
          description: Unblock time in epoch milliseconds.
        restoreTs:
          type: integer
          format: int64
          nullable: true
          description: When the unblock expired, in epoch milliseconds.
        reason:
          type: string
        domain:
          type: string
    Lifecycle:
      type: object
      description: One install or uninstall event.
      properties:
        ts:
          type: integer
          format: int64
        type:
          type: string
          enum: [install, uninstall]
        reason:
          type: string
        note:
          type: string
    Unmanaged:
      type: object
      description: A span during which glocker was uninstalled (fully exposed).
      properties:
        start:
          type: integer
          format: int64
        end:
          type: integer
          format: int64
        open:
          type: boolean
          description: True if glocker is still uninstalled (span ends at now).
        reason:
          type: string
        note:
          type: string
    Downtime:
      type: object
      description: >
        A span the glockdoc heartbeat watchdog observed glocker to be down (a run
        of alive:false liveness samples). Unlike Unmanaged (derived from clean
        uninstall/install events), this reflects observed liveness, so it also
        captures crashes and unclean stops.
      properties:
        start:
          type: integer
          format: int64
        end:
          type: integer
          format: int64
        open:
          type: boolean
          description: True if glocker was still down at the last sample (span ends at now).
    UsageSample:
      type: object
      description: >
        One usage monitor sample: the focused window and idle time at a point in
        time. The full window list from the log is dropped server-side; only the
        active window is forwarded.
      properties:
        ts:
          type: integer
          format: int64
          description: Sample time in epoch milliseconds.
        idleMs:
          type: integer
          format: int64
          description: Milliseconds since last user input, or -1 if unknown.
        active:
          type: object
          nullable: true
          description: The focused window, or null if none was focused.
          properties:
            class:
              type: string
            instance:
              type: string
            title:
              type: string
        windowCount:
          type: integer
          description: Number of open windows observed in the sample.
    UsageRule:
      type: object
      description: >
        One categorization rule. program/title are optional case-insensitive
        regex strings (empty = match anything); the first rule whose present
        regexes all match a sample's active window wins, and $1..$9 in the tag
        interpolate that rule's regex captures.
      required: [tag]
      properties:
        program:
          type: string
          description: Regex matched against the active window class (empty = any).
        title:
          type: string
          description: Regex matched against the active window title (empty = any).
        tag:
          type: string
          description: Assigned tag, conventionally "Category:Value".
    UsageConfig:
      type: object
      description: The usage categorization config — rules plus a per-tag colour map.
      properties:
        rules:
          type: array
          items:
            $ref: "#/components/schemas/UsageRule"
        colors:
          type: object
          description: Map of tag -> "#rrggbb" colour used in the tag charts.
          additionalProperties:
            type: string
            pattern: "^#[0-9a-fA-F]{6}$"
    Data:
      type: object
      properties:
        now:
          type: integer
          format: int64
          description: Server time in epoch milliseconds when the data was read.
        sources:
          $ref: "#/components/schemas/Sources"
        violations:
          type: array
          items:
            $ref: "#/components/schemas/Violation"
        unblocks:
          type: array
          items:
            $ref: "#/components/schemas/Unblock"
        lifecycle:
          type: array
          items:
            $ref: "#/components/schemas/Lifecycle"
        unmanaged:
          type: array
          items:
            $ref: "#/components/schemas/Unmanaged"
        downtime:
          type: array
          items:
            $ref: "#/components/schemas/Downtime"
        usage:
          type: array
          items:
            $ref: "#/components/schemas/UsageSample"
