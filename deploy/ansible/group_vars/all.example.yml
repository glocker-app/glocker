# Copy to group_vars/all.yml, fill in, then (optionally): ansible-vault encrypt group_vars/all.yml
# The glockpeek binary is built locally from your working tree and shipped over,
# so there's nothing here about repos or Go versions.

# Domains (both must resolve to the droplet — one A record each).
# Apex serves the static landing page; the subdomain serves the glockpeek app.
landing_domain: "example.com"
dashboard_domain: "my.example.com"

# Postgres.
pg_db: "glockpeek"
pg_user: "glockpeek"
pg_password: "CHANGE-ME"        # secret — vault this

# First dashboard account (created by the playbook).
admin_user: "admin"
admin_password: "CHANGE-ME"     # secret — vault this

# NOTE: the glockpeek app config (mode, DB DSN, mail, billing) is NO LONGER
# rendered by Ansible. It lives in the gitignored conf/glockpeek.yaml (see
# conf/glockpeek.yaml.sample) and is shipped by `make deploy` / `make
# deploy-config`. Ansible only provisions the box (postgres, caddy, service user,
# systemd). Put the Mailgun key etc. there, not here.
