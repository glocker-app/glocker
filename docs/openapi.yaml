openapi: 3.0.3
info:
  title: glockpeek API
  version: 0.1.0
  description: >
    Serves the parsed glocker log history (violations, unblocks, lifecycle
    events, and computed unmanaged periods) to the dashboard frontend. All
    aggregation and date-range filtering happens client-side; these endpoints
    return the full parsed data set.
servers:
  - url: http://localhost:4317
paths:
  /api/data:
    get:
      summary: Full parsed glocker history
      operationId: getData
      responses:
        "200":
          description: Parsed history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Data"
        "500":
          description: Server error reading or parsing logs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/rules:
    get:
      summary: The account's usage-categorization rules
      description: >
        Session-gated. Returns the account's rules in precedence order (first
        match per namespace wins), each with the ids of the registry tags it
        attaches. Tags themselves come from /api/tags. See docs/tags-and-rules.md.
      operationId: getRules
      responses:
        "200":
          description: Current rules
          content:
            application/json:
              schema:
                type: object
                properties:
                  rules:
                    type: array
                    items:
                      $ref: "#/components/schemas/UsageRule"
        "401": { description: Not authenticated }
    put:
      summary: Replace the account's rules
      operationId: putRules
      description: >
        Session-gated. Body is `{ rules: [...] }`, a full replace-all. Each rule
        may carry at most one tag per namespace, and every tag id must be one the
        account can use (a system `Glocker:*` tag or its own). The legacy `Tag`
        column is dual-written from the first tag during the transition. Rejected
        bodies leave the stored rules untouched.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                rules:
                  type: array
                  items:
                    $ref: "#/components/schemas/UsageRule"
      responses:
        "200":
          description: The saved rules (same shape as GET)
          content:
            application/json:
              schema:
                type: object
                properties:
                  rules:
                    type: array
                    items:
                      $ref: "#/components/schemas/UsageRule"
        "400": { description: A rule carries two tags in one namespace, or an unknown/inaccessible tag id }
        "401": { description: Not authenticated }
  /api/ignored:
    get:
      summary: Violations marked as false positives (hidden from all stats)
      operationId: getIgnored
      responses:
        "200":
          description: Current ignore list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IgnoredConfig"
        "500":
          description: Server error reading the ignore file
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    put:
      summary: Replace the whole false-positive ignore list
      operationId: putIgnored
      description: >
        Body is `{ ignored: [...] }`. Each entry (ts + keyword + url) identifies a
        single recorded violation to hide from counts. Non-destructive — the raw
        reports log is never modified.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IgnoredConfig"
      responses:
        "200":
          description: The deduped ignore list that was saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IgnoredConfig"
        "500":
          description: Server error writing the ignore file
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/health:
    get:
      summary: Liveness and which log files were found
      operationId: getHealth
      responses:
        "200":
          description: Health status
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  sources:
                    $ref: "#/components/schemas/Sources"
                  paths:
                    type: object
                    additionalProperties:
                      type: string
  /api/admin/cancel-subscription:
    post:
      summary: Cancel a user's subscription and reset to free (admin-only)
      description: >
        One admin action: if the account has a live subscription it is revoked at Polar
        first (so nothing is left billing), then glockpeek's record is reset to the free
        tier (blank status, free device cap, no stored subscription id). The in-app
        replacement for the Polar merchant dashboard. Admin-gated. An already-canceled or
        already-gone subscription is treated as success, so this also repairs drift; a
        free account is an idempotent no-op.
      operationId: adminCancelSubscription
      parameters:
        - name: id
          in: query
          required: true
          schema:
            type: integer
          description: Target account id.
      responses:
        "200":
          description: Canceled at the provider (if any) and reset to free
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
        "400":
          description: Invalid id
        "403":
          description: Not the admin account
        "404":
          description: No such user
        "502":
          description: Could not revoke at the provider
  /api/admin/metrics:
    get:
      summary: Live server and database health (admin-only)
      description: >
        JSON operational snapshot for the admin dashboard: process uptime/build and
        the database connection-pool stats + a live ping. Admin-gated (the configured
        admin account only). The same numbers are exposed as Prometheus text at /metrics.
      operationId: getAdminMetrics
      responses:
        "200":
          description: Metrics snapshot
          content:
            application/json:
              schema:
                type: object
                properties:
                  uptimeSeconds:
                    type: integer
                    format: int64
                  version:
                    type: string
                  db:
                    type: object
                    properties:
                      up:
                        type: boolean
                      pingSeconds:
                        type: number
                      open:
                        type: integer
                      inUse:
                        type: integer
                      idle:
                        type: integer
                      max:
                        type: integer
                      waitCount:
                        type: integer
                        format: int64
                      waitSeconds:
                        type: number
        "403":
          description: Not an admin account
  /api/tags:
    get:
      summary: The account's tag registry
      description: >
        Session-gated. Returns the shared system tags (`Glocker:*`, with this
        account's distraction overrides applied) followed by the account's own
        tags. See docs/tags-and-rules.md.
      operationId: listTags
      responses:
        "200":
          description: Registry
          content:
            application/json:
              schema:
                type: object
                properties:
                  tags:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer }
                        scope: { type: string, enum: [system, user] }
                        namespace: { type: string }
                        name: { type: string }
                        color: { type: string }
                        distraction: { type: boolean }
                        behavior: { type: string, description: "\"\" or \"hide\" (windows dropped from usage totals)." }
        "401": { description: Not authenticated }
    post:
      summary: Create a user tag
      description: Session-gated. Adds a tag in one of the account's own namespaces (not `Glocker`).
      operationId: createTag
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                namespace: { type: string }
                name: { type: string }
                color: { type: string }
                distraction: { type: boolean }
      responses:
        "201": { description: Created; returns the tag }
        "400": { description: Missing fields, or the reserved Glocker namespace }
        "409": { description: A tag with that namespace+name already exists }
        "401": { description: Not authenticated }
    patch:
      summary: Edit a tag (or override a system tag's distraction)
      description: >
        Session-gated. `?id=<tag>`. A user tag is edited in place; a system tag
        accepts only a distraction change, stored as this account's override.
      operationId: patchTag
      parameters:
        - in: query
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                namespace: { type: string }
                name: { type: string }
                color: { type: string }
                distraction: { type: boolean }
      responses:
        "204": { description: Updated }
        "404": { description: Tag not found / not yours }
        "401": { description: Not authenticated }
    delete:
      summary: Delete a user tag
      description: Session-gated. `?id=<tag>`. Removes the tag and unlinks it from the account's rules. System tags cannot be deleted.
      operationId: deleteTag
      parameters:
        - in: query
          name: id
          required: true
          schema: { type: integer }
      responses:
        "204": { description: Deleted }
        "403": { description: System tag — cannot be deleted }
        "404": { description: Tag not found / not yours }
        "401": { description: Not authenticated }

  /api/config:
    get:
      summary: Read device configuration snapshot(s)
      description: >
        Modes by credential + query. Browser session, no query: every device's
        latest config snapshot (no blocklist), for the Config tab. Browser
        session, ?blocklist=1: every device's gzip'd blocklist blob (multi-MB),
        for the dashboard's membership checks + domain search. Ingest bearer
        token, ?mine=1: the stored snapshot + blocklist hashes for that device, so
        the agent re-uploads only what changed. All blobs are content-blind —
        opaque (base64 nonce||ciphertext under E2E, or cleartext/base64 gzip in
        plaintext mode) and the server never parses them.
      operationId: getDeviceConfig
      parameters:
        - in: query
          name: mine
          required: false
          schema: { type: string, enum: ["1"] }
          description: With an ingest token, return this device's snapshot + blocklist hashes.
        - in: query
          name: blocklist
          required: false
          schema: { type: string, enum: ["1"] }
          description: With a session, return every device's blocklist blob instead of snapshots.
      responses:
        "200":
          description: Snapshot list, blocklist list, or hashes (by mode)
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    properties:
                      configs:
                        type: array
                        items:
                          type: object
                          properties:
                            deviceId: { type: integer }
                            name: { type: string, description: Device label (API-token name; empty for local/single-device). }
                            ts: { type: integer, format: int64, description: Snapshot capture time (epoch ms). }
                            encrypted: { type: boolean }
                            config: { type: string, description: Opaque snapshot blob; decrypted client-side. }
                  - type: object
                    properties:
                      blocklists:
                        type: array
                        items:
                          type: object
                          properties:
                            deviceId: { type: integer }
                            encrypted: { type: boolean }
                            hash: { type: string, description: Blocklist fingerprint (aad for decryption). }
                            blocklist: { type: string, description: gzip'd domain list, encrypted+base64 or base64; gunzipped client-side. }
                  - type: object
                    properties:
                      hash: { type: string, description: Stored snapshot hash; empty if none. }
                      blocklistHash: { type: string, description: Stored blocklist hash; empty if none. }
        "401":
          description: Not authenticated
    post:
      summary: Upload this device's configuration snapshot (agent)
      description: >
        The glocker agent upserts its latest config snapshot (one row per
        user+device; latest only, no history). Ingest-token gated; the device is
        stamped server-side from the token. When the operator sets
        require_encryption, an unencrypted snapshot is rejected (422), matching
        the ingest backstop.
      operationId: putDeviceConfig
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ts: { type: integer, format: int64, description: Snapshot capture time (epoch ms). }
                encrypted: { type: boolean }
                hash: { type: string, description: Stable fingerprint of the plaintext subset. }
                config: { type: string, description: Opaque blob (base64 nonce||ciphertext under E2E, or cleartext JSON). }
                blocklistHash: { type: string, description: Optional; fingerprint of the plaintext domain list. Present only when the blocklist changed. }
                blocklist: { type: string, description: Optional; gzip'd domain list, encrypted+base64 or base64. Sent only when blocklistHash changed. }
      responses:
        "204":
          description: Snapshot stored
        "401":
          description: Missing or invalid ingest token
        "422":
          description: require_encryption is on but the snapshot is not encrypted
  /api/billing/checkout:
    post:
      summary: Start a checkout for the paid tier (Merchant-of-Record, Polar)
      description: >
        Creates a Polar checkout session for the authenticated account and
        returns the hosted checkout URL to redirect the browser to. The account's
        numeric id is attached as external_customer_id (never the email), so the
        webhook can map the resulting subscription back without glockpeek holding
        payer PII. Only mounted when billing is enabled; session-gated.
      operationId: startBillingCheckout
      responses:
        "200":
          description: Checkout session created
          content:
            application/json:
              schema:
                type: object
                properties:
                  url:
                    type: string
                    format: uri
                    description: Hosted Polar checkout URL to redirect the customer to.
        "401":
          description: Not authenticated
        "502":
          description: Upstream (Polar) error creating the checkout
  /api/billing/cancel:
    post:
      summary: Cancel the subscription at period end (no portal round trip)
      description: >
        Cancels the authenticated account's subscription via the Polar API
        (PATCH /v1/subscriptions/{id} with cancel_at_period_end), keeping full
        access until the current period ends. Records the canceled state from the
        API response immediately (the webhook reconciles idempotently). Only
        mounted when billing is enabled; session-gated.
      operationId: cancelBillingSubscription
      responses:
        "200":
          description: Cancellation scheduled
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: New subscription status ("canceled").
                  subCurrentEnd:
                    type: string
                    format: date-time
                    description: Access is retained until this time.
        "401":
          description: Not authenticated
        "409":
          description: No cancelable subscription (not trialing/active)
        "502":
          description: Upstream (Polar) error canceling
  /api/billing/webhook:
    post:
      summary: Merchant-of-Record subscription webhook (Polar)
      description: >
        Receives Polar subscription lifecycle events. The request is verified
        against the Standard Webhooks HMAC signature before anything is trusted;
        the event is then mapped onto the account's device limit —
        active/uncanceled grant the paid cap, revoked drops back to free, canceled
        keeps access until the period end, and past_due (failed renewal) holds
        access through a grace window before revoked→expired. Not session-gated (the
        caller is Polar, authenticated by the signature, not a browser). Idempotent.
      operationId: billingWebhook
      parameters:
        - in: header
          name: webhook-id
          required: true
          schema: { type: string }
        - in: header
          name: webhook-timestamp
          required: true
          schema: { type: string }
        - in: header
          name: webhook-signature
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: A Polar webhook event; only subscription.* types are acted on.
              properties:
                type:
                  type: string
                  example: subscription.active
                data:
                  type: object
      responses:
        "200":
          description: Event applied, or safely ignored/acked (unknown account or unhandled type)
        "401":
          description: Signature verification failed
        "502":
          description: Transient processing error; Polar should retry
        "503":
          description: Billing webhook not configured (no valid signing secret)

components:
  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
    IgnoredConfig:
      type: object
      properties:
        ignored:
          type: array
          items:
            $ref: "#/components/schemas/IgnoredViolation"
    IgnoredViolation:
      type: object
      description: >
        One recorded violation marked as a false positive. Matched by ts +
        keyword + url; domain is stored only for display.
      properties:
        ts:
          type: integer
          format: int64
          description: Event time in epoch milliseconds (matches Violation.ts).
        keyword:
          type: string
        url:
          type: string
        domain:
          type: string
    Sources:
      type: object
      description: Whether each log file was found and readable.
      properties:
        reports:
          type: boolean
        unblocks:
          type: boolean
        lifecycle:
          type: boolean
        usage:
          type: boolean
        heartbeat:
          type: boolean
    Violation:
      type: object
      description: One content/URL keyword violation report.
      properties:
        ts:
          type: integer
          format: int64
          description: Event time in epoch milliseconds (local-zone naive timestamp).
        type:
          type: string
          enum: [url-keyword, content-keyword]
        keyword:
          type: string
        url:
          type: string
        domain:
          type: string
    Unblock:
      type: object
      description: One temporary unblock grant.
      properties:
        ts:
          type: integer
          format: int64
          description: Unblock time in epoch milliseconds.
        restoreTs:
          type: integer
          format: int64
          nullable: true
          description: When the unblock expired, in epoch milliseconds.
        reason:
          type: string
        domain:
          type: string
    Lifecycle:
      type: object
      description: One install or uninstall event.
      properties:
        ts:
          type: integer
          format: int64
        type:
          type: string
          enum: [install, uninstall]
        reason:
          type: string
        note:
          type: string
    Unmanaged:
      type: object
      description: A span during which glocker was uninstalled (fully exposed).
      properties:
        start:
          type: integer
          format: int64
        end:
          type: integer
          format: int64
        open:
          type: boolean
          description: True if glocker is still uninstalled (span ends at now).
        reason:
          type: string
        note:
          type: string
    Downtime:
      type: object
      description: >
        A span the glockdoc heartbeat watchdog observed glocker to be down (a run
        of alive:false liveness samples). Unlike Unmanaged (derived from clean
        uninstall/install events), this reflects observed liveness, so it also
        captures crashes and unclean stops.
      properties:
        start:
          type: integer
          format: int64
        end:
          type: integer
          format: int64
        open:
          type: boolean
          description: True if glocker was still down at the last sample (span ends at now).
    UsageSample:
      type: object
      description: >
        One usage monitor sample: the focused window and idle time at a point in
        time. The full window list from the log is dropped server-side; only the
        active window is forwarded.
      properties:
        ts:
          type: integer
          format: int64
          description: Sample time in epoch milliseconds.
        idleMs:
          type: integer
          format: int64
          description: Milliseconds since last user input, or -1 if unknown.
        active:
          type: object
          nullable: true
          description: The focused window, or null if none was focused.
          properties:
            class:
              type: string
            instance:
              type: string
            title:
              type: string
        windowCount:
          type: integer
          description: Number of open windows observed in the sample.
    UsageRule:
      type: object
      description: >
        One categorization rule. program/title are optional case-insensitive
        regex strings (empty = match anything); the first rule whose present
        regexes all match a sample's active window wins per namespace. Instead of
        a tag string, a rule attaches registry tags by id (tagIds), at most one
        per namespace. Matching runs client-side (the server is content-blind).
      properties:
        id:
          type: integer
          description: Rule id (present on GET; ignored on PUT — the set is replaced wholesale).
        position:
          type: integer
          description: Precedence order; lower wins. Defaults to array order when 0.
        program:
          type: string
          description: Regex matched against the active window class (empty = any).
        title:
          type: string
          description: Regex matched against the active window title (empty = any).
        tagIds:
          type: array
          description: Ids of the registry tags this rule attaches (one per namespace). See /api/tags.
          items:
            type: integer
    Data:
      type: object
      properties:
        now:
          type: integer
          format: int64
          description: Server time in epoch milliseconds when the data was read.
        sources:
          $ref: "#/components/schemas/Sources"
        violations:
          type: array
          items:
            $ref: "#/components/schemas/Violation"
        unblocks:
          type: array
          items:
            $ref: "#/components/schemas/Unblock"
        lifecycle:
          type: array
          items:
            $ref: "#/components/schemas/Lifecycle"
        unmanaged:
          type: array
          items:
            $ref: "#/components/schemas/Unmanaged"
        downtime:
          type: array
          items:
            $ref: "#/components/schemas/Downtime"
        usage:
          type: array
          items:
            $ref: "#/components/schemas/UsageSample"
